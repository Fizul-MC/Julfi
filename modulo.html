
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammd Julfikar Al - 262505008 - Modulo — Smart Calculator</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #080b16;
    --panel: rgba(20, 26, 48, .85);
    --border: rgba(255,255,255,.09);
    --text: #f4f6ff;
    --muted: #929bb8;
    --purple: #9b87ff;
    --blue: #59c7ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 35px 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at 15% 10%, #27205a 0%, transparent 40%),
        radial-gradient(ellipse at 90% 90%, #102e4b 0%, transparent 40%),
        var(--bg);
}

.app {
    width: 100%;
    max-width: 460px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 45px;
    height: 45px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    font-size: 23px;
    font-weight: 800;
    color: white;
    background: linear-gradient(135deg, #8d78ff, #4cafff);
    box-shadow: 0 5px 25px #7d6bff40;
}

.brand-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.brand-sub {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.status {
    font-size: 11px;
    color: #78efbd;
    background: #153c34;
    padding: 8px 11px;
    border-radius: 20px;
}

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 25px;
    padding: 27px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 70px #00000040;
}

.eyebrow {
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 10px;
    font-weight: 800;
}

h1 {
    font-size: 29px;
    letter-spacing: -1.2px;
    margin: 12px 0 9px;
}

.subtitle {
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    margin: 0 0 27px;
}

.field-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    margin: 19px 0 10px;
}

.field-label span {
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
}

.input-wrap {
    position: relative;
}

input {
    width: 100%;
    padding: 17px;
    color: white;
    background: #0b1020;
    border: 1px solid #29314b;
    border-radius: 13px;
    outline: none;
    font-size: 18px;
    font-family: inherit;
    transition: .2s;
}

input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px #9b87ff18;
}

input::placeholder {
    color: #4e5875;
}

.operator {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 19px 0;
    color: var(--muted);
    font-size: 11px;
}

.operator::before,
.operator::after {
    content: "";
    height: 1px;
    background: var(--border);
    flex: 1;
}

.operator strong {
    color: var(--purple);
    font-size: 18px;
    background: #9b87ff12;
    padding: 9px 13px;
    border-radius: 10px;
}

.calculate {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 17px;
    margin-top: 25px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: linear-gradient(105deg, #8068f8, #448ff4);
    box-shadow: 0 8px 25px #6d65f833;
    transition: transform .2s, filter .2s;
}

.calculate:hover {
    filter: brightness(1.13);
    transform: translateY(-2px);
}

.calculate:active {
    transform: scale(.98);
}

.error {
    color: #ff8e9e;
    font-size: 12px;
    margin-top: 14px;
    text-align: center;
}

.result {
    display: none;
    margin-top: 22px;
    padding: 21px;
    text-align: center;
    border: 1px solid #9b87ff40;
    border-radius: 17px;
    background: linear-gradient(140deg, #8d76ff13, #4cbdff0c);
    animation: appear .35s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(9px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.result-number {
    font-size: 53px;
    font-weight: 800;
    letter-spacing: -2px;
    margin: 8px 0;
    background: linear-gradient(110deg, #b3a2ff, #62d4ff);
    color: transparent;
    background-clip: text;
}

.equation {
    color: #c2c9e1;
    font-size: 13px;
    word-break: break-word;
}

.explanation {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
    margin-top: 14px;
    padding-top: 13px;
    border-top: 1px solid var(--border);
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 26px 2px 13px;
}

.section-head h2 {
    font-size: 13px;
    margin: 0;
}

.clear {
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
}

.history {
    background: #10162a9c;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
}

.history-empty {
    text-align: center;
    padding: 22px 10px;
    color: var(--muted);
    font-size: 12px;
}

.history-item {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
}

.history-item:last-child {
    border-bottom: none;
}

.history-equation {
    font-size: 12px;
    color: #c2c9e1;
    overflow-wrap: anywhere;
}

.history-time {
    color: var(--muted);
    font-size: 10px;
    margin-top: 5px;
}

.history-answer {
    color: var(--blue);
    font-weight: 800;
    font-size: 17px;
    flex-shrink: 0;
}

.footer {
    text-align: center;
    color: #59617e;
    font-size: 10px;
    margin-top: 22px;
}

@media (max-width: 420px) {
    .card { padding: 21px; }
    h1 { font-size: 26px; }
}
</style>
</head>

<body>
<main class="app">

    <header class="topbar">
        <div class="brand">
            <div class="logo">%</div>
            <div>
                <div class="brand-name">MODULO<span style="color:#9b87ff">.</span></div>
                <div class="brand-sub">SMART MATH CALCULATOR</div>
            </div>
        </div>
        <div class="status">● System Ready</div>
    </header>

    <section class="card">
        <div class="eyebrow">Mathematics / 001</div>
        <h1>Kalkulator Modulo</h1>
        <p class="subtitle">
            Hitung sisa pembagian dengan cepat, akurat, dan praktis.
        </p>

        <form id="moduloForm">
            <label class="field-label" for="a">
                Bilangan pertama <span>INPUT A</span>
            </label>
            <div class="input-wrap">
                <input id="a" type="number" step="any"
                    placeholder="Masukkan angka..." required>
            </div>

            <div class="operator">
                OPERASI
                <strong>mod</strong>
                REMAINDER
            </div>

            <label class="field-label" for="b">
                Bilangan kedua <span>INPUT B</span>
            </label>
            <div class="input-wrap">
                <input id="b" type="number" step="any"
                    placeholder="Masukkan pembagi..." required>
            </div>

            <button class="calculate" type="submit">
                Hitung Sekarang &nbsp; ↗
            </button>
        </form>

        <div class="error" id="error" role="alert"></div>

        <div class="result" id="result" aria-live="polite">
            <div class="result-label">Hasil Modulo</div>
            <div class="result-number" id="answer">0</div>
            <div class="equation" id="equation"></div>
            <div class="explanation" id="explanation"></div>
        </div>
    </section>

    <div class="section-head">
        <h2>Riwayat Perhitungan</h2>
        <button class="clear" id="clearHistory" type="button">
            Hapus riwayat ↗
        </button>
    </div>

    <section class="history" id="history">
        <div class="history-empty">
            Belum ada perhitungan. Coba hitung sesuatu!
        </div>
    </section>

    <footer class="footer">
        MODULO CALCULATOR · BUILT FOR CURIOUS MINDS
    </footer>

</main>

<script>
const form = document.getElementById("moduloForm");
const inputA = document.getElementById("a");
const inputB = document.getElementById("b");
const result = document.getElementById("result");
const answer = document.getElementById("answer");
const equation = document.getElementById("equation");
const explanation = document.getElementById("explanation");
const error = document.getElementById("error");
const historyBox = document.getElementById("history");

let historyData = [];

function formatNumber(n) {
    if (Object.is(n, -0) || n === 0) return "0";
    return Number(n.toPrecision(12)).toString();
}

function modulo(a, b) {
    // Modulo dengan hasil mengikuti tanda pembagi.
    let r = ((a % Math.abs(b)) + Math.abs(b)) % Math.abs(b);

    if (Math.abs(r) < 1e-12) r = 0;
    return r;
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const a = inputA.valueAsNumber;
    const b = inputB.valueAsNumber;

    error.textContent = "";
    result.style.display = "none";

    if (!Number.isFinite(a) || !Number.isFinite(b)) {
        error.textContent = "Masukkan dua bilangan yang valid.";
        return;
    }

    if (b === 0) {
        error.textContent = "Pembagi tidak boleh bernilai nol.";
        inputB.focus();
        return;
    }

    const r = modulo(a, b);
    const fa = formatNumber(a);
    const fb = formatNumber(b);
    const fr = formatNumber(r);

    answer.textContent = fr;
    equation.textContent = `${fa} mod ${fb} = ${fr}`;

    const quotient = Math.floor(a / Math.abs(b));
    explanation.textContent =
        `Sisa pembagian dari ${fa} oleh ${fb} adalah ${fr}.`;

    result.style.display = "block";

    historyData.unshift({
        equation: `${fa} mod ${fb}`,
        answer: fr,
        time: new Date().toLocaleTimeString("id-ID", {
            hour: "2-digit",
            minute: "2-digit"
        })
    });

    historyData = historyData.slice(0, 5);
    renderHistory();
});

function renderHistory() {
    historyBox.replaceChildren();

    if (historyData.length === 0) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = "Belum ada perhitungan. Coba hitung sesuatu!";
        historyBox.appendChild(empty);
        return;
    }

    historyData.forEach(item => {
        const row = document.createElement("div");
        row.className = "history-item";

        const details = document.createElement("div");

        const eq = document.createElement("div");
        eq.className = "history-equation";
        eq.textContent = item.equation;

        const time = document.createElement("div");
        time.className = "history-time";
        time.textContent = item.time;

        const val = document.createElement("div");
        val.className = "history-answer";
        val.textContent = "= " + item.answer;

        details.append(eq, time);
        row.append(details, val);
        historyBox.appendChild(row);
    });
}

document.getElementById("clearHistory").addEventListener("click", () => {
    historyData = [];
    renderHistory();
});

</script>
</body>
</html>
